[project]
name = "two-gates-active-inference"
version = "0.1.0"
description = "A visual JEPA, latent diffusion, and active inference teaching demo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.11,<3",
  "torch>=2.7,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[project.scripts]
two-gates = "two_gates.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/two_gates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

